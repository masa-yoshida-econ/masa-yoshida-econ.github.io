# Render the Quarto site on every push to main and publish to GitHub Pages.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # setup-r-dependencies hung twice (2026-10-23, 10-27); plain install from the
      # Posit binary repo (set by setup-r) takes ~20 s.
      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
